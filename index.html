{id:"svc",ic:"📄",t:"Послуги.pdf",h:()=>'<h2>Послуги</h2>'+CFG.services.map((s,i)=>'<div class="it" style="animation-delay:'+i*70+'ms"><b>'+esc(s[0])+'</b><span>'+esc(s[1])+'</span></div>').join("")+'<h2 style="margin-top:18px">Як я працюю</h2><div class="stp">'+CFG.steps.map((s,i)=>'<div class="it" style="animation-delay:'+(i*70+300)+'ms"><div><b>'+esc(s[0])+'</b><span>'+esc(s[1])+'</span></div></div>').join("")+'</div>'},
{id:"contact",ic:"✉️",t:"Контакти.app",h:()=>'<h2>Давайте працювати разом</h2><p>Найшвидше відповідаю в Telegram.</p><div class="rw"><div class="l"><span>Telegram</span><b>@'+esc(CFG.tg)+'</b></div><button class="sm" data-copy="@'+esc(CFG.tg)+'">Копіювати</button><a class="sm" href="'+TG+'" target="_blank" rel="noopener">Відкрити</a></div><textarea id="msg" placeholder="Розкажіть про проєкт: що за відео, платформа, терміни…"></textarea><button class="bt p" id="send" style="width:100%">Надіслати в Telegram</button>'},
{id:"notes",ic:"💬",t:"Відгуки",h:()=>'<h2>Відгуки клієнтів</h2><p>Переписки з клієнтами</p><div class="shots"><figure><img data-img="r1" src="'+MEDIA.r1+'" alt="Відгук chera10"><figcaption>chera10 · постійний клієнт</figcaption></figure><figure><img data-img="r2" src="'+MEDIA.r2+'" alt="Відгук Віки"><figcaption>Віка · клієнтка</figcaption></figure></div>'+CFG.notes.map((n,i)=>'<div class="it" style="animation-delay:'+i*90+'ms"><div>“'+esc(n[0])+'”</div><span>— '+esc(n[1])+'</span></div>').join("")},
{id:"game",ic:"🎮",t:"Ритм.exe",h:()=>'<h2>Ритм.exe</h2><p>Тисни «Різати», коли біла лінія в зеленій зоні. Кожен влучний різ швидшає.</p><div class="trk" id="trk"><div class="zn" id="zn"></div><div class="hd" id="hd"></div></div><div class="inf"><b id="sc">0</b><span>різів</span><span id="lv"></span><small id="bs"></small></div><button class="bt p" id="cut" style="width:100%">Різати ✂</button><div class="rc"><b>🏆 Лідерборд</b><input id="nm" placeholder="Твоє імʼя" maxlength="14"><div id="tp"></div><button class="bt" id="shr" style="width:100%;margin-top:10px">Поділитися в Telegram</button></div>'}];
let AC=null,SON=true;try{SON=localStorage.getItem("jsn")!="0"}catch(e){}
const SFX={click:[[520,.06,"triangle",.07,380]],tab:[[620,.05,"triangle",.06,720]],open:[[300,.18,"sine",.09,620],[620,.1,"sine",.05,900]],close:[[500,.14,"sine",.08,250]],hit:[[660,.09,"square",.05,990],[990,.12,"square",.05,1320]],miss:[[200,.25,"sawtooth",.07,90]],egg:[[220,.12,"square",.06,440],[440,.12,"square",.06,880],[880,.25,"square",.06,1320]],toast:[[880,.1,"sine",.07,880],[1175,.16,"sine",.07,1175]]};
function snd(k){if(!SON)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=="suspended")AC.resume();
SFX[k].forEach((n,i)=>{const o=AC.createOscillator(),g=AC.createGain(),st=AC.currentTime+i*.09;o.type=n[2];o.frequency.setValueAtTime(n[0],st);o.frequency.exponentialRampToValueAtTime(n[4],st+n[1]);g.gain.setValueAtTime(n[3],st);g.gain.exponentialRampToValueAtTime(.0001,st+n[1]);o.connect(g);g.connect(AC.destination);o.start(st);o.stop(st+n[1]+.02)})}catch(e){}}
let z=100,n=0;
W.forEach((w,i)=>{const e=document.createElement("section");e.className="win";e.id="w-"+w.id;e.setAttribute("aria-label",w.t);
e.innerHTML='<div class="tb"><button class="c" aria-label="Закрити"></button><button class="y" aria-label="Згорнути"></button><button class="g" aria-label="Розгорнути"></button><div class="t">'+esc(w.t)+'</div></div><div class="bd"></div>';$("#wins").appendChild(e);
const d=document.createElement("button");d.className="dk";d.dataset.dock=w.id;d.setAttribute("aria-label",w.t);d.innerHTML=w.ic+"<small>"+esc(w.t)+"</small>";$("#dock").appendChild(d);
const c=document.createElement("button");c.className="di";c.dataset.open=w.id;c.style.animationDelay=(1.2+i*.1)+"s";c.innerHTML="<i>"+w.ic+"</i>"+esc(w.t.split(" ")[0]);$("#ic").appendChild(c)});
function tog(id,f){const e=$("#w-"+id),d=document.querySelector('[data-dock="'+id+'"]'),o=f!==undefined?f:!e.classList.contains("open");
snd(o?"open":"close");
if(o){const w=W.find(x=>x.id==id);e.querySelector(".bd").innerHTML=w.h();if(!e.dataset.p){const ww=Math.min(560,innerWidth*.92);e.style.left=Math.max(12,(innerWidth-ww)/2+(n%4)*30-60)+"px";e.style.top=(64+(n%4)*30)+"px";e.dataset.p=1;n++}
e.style.zIndex=++z;d.classList.remove("bn");void d.offsetWidth;d.classList.add("bn");init(id)}
e.classList.toggle("open",o);if(!o)e.classList.remove("max");d.classList.toggle("on",o)}
function init(id){if(id=="work")grid(tabs[0]);if(id=="about")document.querySelectorAll("[data-n]").forEach(el=>{const t=el.dataset.n,m=parseInt(t),s=t.replace(m,"");let v=0;const k=setInterval(()=>{v+=Math.max(1,Math.ceil(m/20));if(v>=m){v=m;clearInterval(k)}el.textContent=v+s},40)});if(id=="game")rhythm();
const s=$("#send");if(s)s.onclick=()=>open(TG+"?text="+encodeURIComponent($("#msg").value||"Привіт! Хочу замовити монтаж."),"_blank")}
function grid(cat){const g=$("#gr");if(!g)return;g.innerHTML=CFG.works.filter(w=>w[0]==cat).map((w,i)=>'<button class="tl" data-play="'+w[2]+'" style="animation-delay:'+i*80+'ms;background-image:linear-gradient(0deg,rgba(9,9,12,.88),transparent 58%),url('+MEDIA[w[3]]+')"><b>'+esc(w[1])+'</b><small>Дивитись</small></button>').join("")}
function rhythm(){const trk=$("#trk");if(!trk)return;const hd=$("#hd"),zn=$("#zn"),sc=$("#sc"),lv=$("#lv"),cut=$("#cut"),bs=$("#bs");
let p=0,d=1,sp=.55,zc=.5,zw=.18,s=0,l=3,over=0,last=performance.now(),best=0;try{best=+localStorage.getItem("jb")||0}catch(e){}
const nm=$("#nm"),tp=$("#tp");let tops=[];try{tops=JSON.parse(localStorage.getItem("jt"))||[];nm.value=localStorage.getItem("jn")||""}catch(e){}
const rt=()=>{tp.innerHTML=tops.length?tops.map((r,i)=>'<div class="rw2"><span>'+(i+1)+". "+esc(r.n)+"</span><b>"+r.s+"</b></div>").join(""):'<div class="rw2"><span>Тут зʼявляться найкращі спроби.</span></div>'};
async function loadTop(){if(!CFG.dbUrl){rt();return}
try{const r=await fetch(CFG.dbUrl.replace(/\/$/,"")+"/scores.json?orderBy=%22score%22&limitToLast=10");const d=await r.json();
const a=Object.values(d||{}).filter(x=>x&&typeof x.score=="number").sort((x,y)=>y.score-x.score).slice(0,10);
tp.innerHTML=a.length?a.map((x,i)=>'<div class="rw2"><span>'+(["🥇","🥈","🥉"][i]||(i+1)+".")+" "+esc(String(x.name||"Гравець").slice(0,14))+"</span><b>"+x.score+"</b></div>").join(""):'<div class="rw2"><span>Поки порожньо. Будь першим!</span></div>'}catch(e){rt()}}
nm.oninput=()=>{try{localStorage.setItem("jn",nm.value)}catch(e){}};
const sv=()=>{if(s<1)return;tops.push({n:nm.value.trim()||"Гравець",s});tops.sort((a,b)=>b.s-a.s);tops=tops.slice(0,5);try{localStorage.setItem("jt",JSON.stringify(tops))}catch(e){}rt();if(CFG.dbUrl){fetch(CFG.dbUrl.replace(/\/$/,"")+"/scores.json",{method:"POST",body:JSON.stringify({name:(nm.value.trim()||"Гравець").slice(0,14),score:s,t:Date.now()})}).then(loadTop).catch(()=>{})}};
$("#shr").onclick=()=>{const tx="Я зробив "+best+" різів у Ритм.exe на сайті Jetry. Побий мене!";open("https://t.me/share/url?url="+encodeURIComponent(CFG.url||location.href)+"&text="+encodeURIComponent(tx),"_blank")};
const nz=()=>{zc=.15+Math.random()*.7;zn.style.left=(zc-zw/2)*100+"%";zn.style.width=zw*100+"%"};
const ui=()=>{sc.textContent=s;lv.textContent="❤️".repeat(l)+"🖤".repeat(3-l);bs.textContent="рекорд "+best};
loadTop();cut.onclick=()=>{if(over){s=0;l=3;sp=.55;zw=.18;over=0;cut.textContent="Різати ✂";nz();ui();return}
const ok=Math.abs(p-zc)<=zw/2;trk.classList.remove("ok","no");void trk.offsetWidth;trk.classList.add(ok?"ok":"no");snd(ok?"hit":"miss");
if(ok){s++;sp*=1.06;zw=Math.max(.07,zw*.96);nz();if(s>best){best=s;try{localStorage.setItem("jb",best)}catch(e){}}}else{l--;if(l<=0){over=1;cut.textContent="Монтаж провалено. Ще раз?";sv()}}ui()};
(function f(t){if(!document.body.contains(trk))return;const dt=Math.min(.05,(t-last)/1000);last=t;if(!over){p+=d*sp*dt;if(p>=1){p=1;d=-1}if(p<=0){p=0;d=1}}hd.style.left=p*100+"%";requestAnimationFrame(f)})(last);nz();ui()}
function eggStop(){$("#egg").classList.remove("on")}
function egg(){const o=$("#egg");o.querySelector(".ch2").innerHTML='<img class="eg" src="'+MEDIA.egg+'" alt="Пасхалка">';snd("egg");o.classList.add("on")}
function lbOpen(id){$("#lbv").innerHTML='<video src="'+MEDIA[id]+'" poster="'+MEDIA["p"+id.slice(1)]+'" controls autoplay playsinline loop preload="auto"></video>';$("#lb").classList.add("on")}
function lbClose(){$("#lb").classList.remove("on");$("#lbv").innerHTML=""}
document.addEventListener("click",e=>{let t;
if(t=e.target.closest("[data-open]"))return tog(t.dataset.open,true);if(t=e.target.closest("[data-dock]"))return tog(t.dataset.dock);
if(t=e.target.closest(".tb .c,.tb .y"))return tog(t.closest(".win").id.slice(2),false);if(t=e.target.closest(".tb .g"))return t.closest(".win").classList.toggle("max");
if(t=e.target.closest("[data-tab]")){document.querySelectorAll("[data-tab]").forEach(x=>x.classList.toggle("on",x==t));return grid(t.dataset.tab)}
if(t=e.target.closest("[data-copy]")){const d=()=>{t.textContent="Скопійовано";setTimeout(()=>t.textContent="Копіювати",1400)};navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(t.dataset.copy).then(d,d):d()}
if(t=e.target.closest(".win"))t.style.zIndex=++z});
$("#tx").onclick=()=>$("#toast").classList.remove("on");
document.addEventListener("keydown",e=>{if(e.key=="Escape")document.querySelectorAll(".win.open").forEach(w=>tog(w.id.slice(2),false))});
let dr=null;document.addEventListener("pointerdown",e=>{const t=e.target.closest(".tb");if(!t||e.target.closest("button")||innerWidth<=700)return;const w=t.parentElement;if(w.classList.contains("max"))return;w.style.zIndex=++z;dr={w,x:e.clientX-w.offsetLeft,y:e.clientY-w.offsetTop}});
document.addEventListener("pointermove",e=>{if(!dr)return;dr.w.style.left=Math.max(0,Math.min(innerWidth-90,e.clientX-dr.x))+"px";dr.w.style.top=Math.max(36,Math.min(innerHeight-60,e.clientY-dr.y))+"px"});
document.addEventListener("pointerup",()=>dr=null);

document.addEventListener("click",e=>{const t=e.target.closest("[data-play]");if(t)lbOpen(t.dataset.play);const im=e.target.closest("[data-img]");if(im){$("#lbv").innerHTML='<img src="'+MEDIA[im.dataset.img]+'" style="max-width:92vw;max-height:80vh;border-radius:14px" alt="">';$("#lb").classList.add("on")}if(e.target.id=="lb"||e.target.id=="lbx")lbClose();if(e.target.id=="eggx"||e.target.id=="egg")eggStop()});
let ac=0,at=0,hT;const hint=m=>{const el=$("#hn");el.textContent=m;el.classList.add("on");clearTimeout(hT);hT=setTimeout(()=>el.classList.remove("on"),m.length>16?6500:1200)};
document.addEventListener("click",e=>{if(!e.target.closest(".av"))return;const n=Date.now();ac=n-at<1500?ac+1:1;at=n;if(ac>=5){ac=0;$("#hn").classList.remove("on");egg()}else hint(ac>=2?"ще "+(5-ac)+"…":"🍇")});
setTimeout(()=>hint("psst… тицьни на мою аватарку 5 разів"),14000);
let kb="";document.addEventListener("keydown",e=>{if(e.key=="Escape"){lbClose();eggStop()}
if(e.code=="Space"&&$("#cut")&&$("#w-game").classList.contains("open")){e.preventDefault();$("#cut").click()}
if(e.key.length==1){kb=(kb+e.key.toLowerCase()).slice(-5);if(kb=="сліви"||kb=="сливи")egg()}});
const t0=performance.now();setInterval(()=>{const m=performance.now()-t0,f=Math.floor(m/40)%25,s=Math.floor(m/1000);$("#tc").textContent=[Math.floor(s/3600),Math.floor(s/60)%60,s%60,f].map(x=>String(x).padStart(2,"0")).join(":")},40);
$("#sb").textContent=SON?"🔊":"🔇";$("#sb").onclick=()=>{SON=!SON;$("#sb").textContent=SON?"🔊":"🔇";try{localStorage.setItem("jsn",SON?"1":"0")}catch(e){}snd("click")};
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b||b.closest("[data-open],.dk,.di,.tb,#cut,#sb"))return;snd(b.dataset.tab?"tab":"click")});
const tick=()=>$("#clk").textContent=new Date().toLocaleString("uk-UA",{weekday:"short",hour:"2-digit",minute:"2-digit"});tick();setInterval(tick,30000);
(function ty(){const el=$("#rl"),T=CFG.realName+" · "+CFG.role.toLowerCase();let i=0;setTimeout(function k(){el.textContent=T.slice(0,++i);if(i<T.length)setTimeout(k,70)},1700)})();
setTimeout(()=>$("#boot").classList.add("off"),1500);setTimeout(()=>{$("#toast").classList.add("on");snd("toast")},6500);
</script>
</body>
